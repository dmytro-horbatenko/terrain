name: Practice checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Read pinned Foundry version
        id: foundry
        run: echo "version=$(cat .foundry-version)" >> "$GITHUB_OUTPUT"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ steps.foundry.outputs.version }}
      - name: Install pinned JavaScript dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Check existing artifacts
        run: yarn check
